services:
  luy:
    build: .
    ports:
      - "127.0.0.1:4180:8080"
    env_file:
      - path: .env.local
        required: false
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      COOKIE_SECURE: "false"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
